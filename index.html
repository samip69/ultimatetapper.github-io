<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Tapper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-container">
    <!-- Gear Button -->
    <div class="gear-container">
      <button id="gearButton" class="gear-button">⚙️</button>
      <div id="gearMenu" class="gear-menu">
        <button id="saveButton">Save Game</button>
        <button id="resetButton">Reset Game</button>
      </div>
    </div>

    <div class="tap-count">Taps: <span id="tapCount">0</span></div>
    <div class="balloon" id="balloon"></div>
    <button id="pauseResumeButton">Pause</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
